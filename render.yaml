# --- Despliegue del bot traductor en Render ---------------------------------
# Render lee este archivo cuando creas un "Blueprint" a partir del repositorio
# de GitHub. El token NO se guarda aquí: se pega en el panel de Render.
#
# Plan gratuito (web service): se duerme a los ~15 minutos sin visitas HTTP.
# Para que no se duerma, programa un monitor externo (UptimeRobot, cron-job.org)
# que visite https://TU-BOT.onrender.com/health cada 5 minutos.
#
# Para trabajos muy largos (+1000 capítulos) lo ideal es un "background worker"
# de pago (7 $/mes): no se duerme y no necesita el servidor de salud. Cambia el
# bloque de abajo por este:
#
#   - type: worker
#     name: traductor-bot
#     runtime: python
#     plan: starter
#     buildCommand: pip install -r requirements.txt
#     startCommand: python bot.py
#     envVars:
#       - {key: PYTHON_VERSION, value: "3.12.7"}
#       - {key: TELEGRAM_BOT_TOKEN, sync: false}
#
services:
  - type: web
    name: traductor-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Obligatorio: se pega en Render → Environment (nunca en el repositorio).
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DEFAULT_TARGET_LANG
        value: es
      - key: TRANSLATE_CONCURRENCY
        value: "3"
      # Ritmo del endpoint web gratuito (los IP de datacenter se limitan antes).
      - key: WEB_MIN_INTERVAL
        value: "1.0"
      - key: WEB_MAX_INTERVAL
        value: "10"
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: TRANSLATOR_BACKEND
        value: web
      - key: CACHE_TTL_DAYS
        value: "7"
      - key: CACHE_MAX_MB
        value: "512"
